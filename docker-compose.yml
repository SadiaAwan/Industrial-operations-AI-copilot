services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: copilot_test
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copilot -d copilot_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - copilot_postgres_data:/var/lib/postgresql/data

volumes:
  copilot_postgres_data:
