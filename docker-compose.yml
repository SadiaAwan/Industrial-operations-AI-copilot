name: industrial-ai-copilot

x-api-environment: &api-environment
  RUNTIME_MODE: mock
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-copilot}:${POSTGRES_PASSWORD:-copilot}@postgres:5432/${POSTGRES_DB:-copilot}
  DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
  DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-10}
  DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-30}
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_EXPERIMENT_NAME: ${MLFLOW_EXPERIMENT_NAME:-industrial-operations-copilot}
  MLFLOW_LANGCHAIN_AUTOLOG: ${MLFLOW_LANGCHAIN_AUTOLOG:-true}
  MLFLOW_DATABASE_NAME: ${MLFLOW_DATABASE_NAME:-mlflow}

services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-copilot}
      POSTGRES_USER: ${POSTGRES_USER:-copilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copilot}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - copilot_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  database-init:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - /bin/sh
      - -ec
      - python -m scripts.init_mlflow_database && alembic upgrade head && python -m scripts.seed_database
    environment: *api-environment
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile
    command:
      - mlflow
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --backend-store-uri
      - postgresql+psycopg://${POSTGRES_USER:-copilot}:${POSTGRES_PASSWORD:-copilot}@postgres:5432/${MLFLOW_DATABASE_NAME:-mlflow}
      - --artifacts-destination
      - /app/mlartifacts
      - --allowed-hosts
      - mlflow:5000,localhost:5000,127.0.0.1:5000
    environment:
      MLFLOW_ENABLE_PROXY_MULTIPART_UPLOAD: "true"
    ports:
      - "${MLFLOW_PORT:-5000}:5000"
    depends_on:
      database-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=2)
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    volumes:
      - copilot_mlflow_artifacts:/app/mlartifacts
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment: *api-environment
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      database-init:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      COPILOT_UI_API_BASE_URL: http://api:8000
      COPILOT_UI_API_TIMEOUT_SECONDS: ${COPILOT_UI_API_TIMEOUT_SECONDS:-20}
      COPILOT_UI_MACHINE_IDS: ${COPILOT_UI_MACHINE_IDS:-P-101,P-102,P-103,P-104,P-105}
    ports:
      - "${UI_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

volumes:
  copilot_postgres_data:
  copilot_mlflow_artifacts:
