<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">Reference fixture latency and estimated cost</title>
  <desc id="desc">Bar charts for three deterministic evaluation cases. Latencies are 1250, 1800, and 45 milliseconds. Estimated costs are 0.018, 0.024, and 0 US dollars.</desc>
  <rect width="920" height="430" fill="#ffffff"/>
  <text x="40" y="38" font-family="sans-serif" font-size="22" font-weight="700" fill="#172033">Deterministic reference results</text>
  <text x="40" y="62" font-family="sans-serif" font-size="13" fill="#536173">Dataset industrial-copilot-reference@1.0.0 — not a production benchmark</text>

  <text x="40" y="105" font-family="sans-serif" font-size="17" font-weight="700" fill="#172033">Latency (ms)</text>
  <line x1="155" y1="115" x2="155" y2="258" stroke="#aab3c2"/>
  <text x="40" y="142" font-family="sans-serif" font-size="13" fill="#172033">E2E-001</text>
  <rect x="155" y="124" width="250" height="24" rx="3" fill="#3977d5"/>
  <text x="414" y="142" font-family="sans-serif" font-size="13" fill="#172033">1,250</text>
  <text x="40" y="190" font-family="sans-serif" font-size="13" fill="#172033">E2E-003</text>
  <rect x="155" y="172" width="360" height="24" rx="3" fill="#3977d5"/>
  <text x="524" y="190" font-family="sans-serif" font-size="13" fill="#172033">1,800</text>
  <text x="40" y="238" font-family="sans-serif" font-size="13" fill="#172033">SAFE-001</text>
  <rect x="155" y="220" width="9" height="24" rx="3" fill="#3977d5"/>
  <text x="173" y="238" font-family="sans-serif" font-size="13" fill="#172033">45</text>

  <text x="570" y="105" font-family="sans-serif" font-size="17" font-weight="700" fill="#172033">Estimated cost (USD)</text>
  <line x1="685" y1="115" x2="685" y2="258" stroke="#aab3c2"/>
  <text x="570" y="142" font-family="sans-serif" font-size="13" fill="#172033">E2E-001</text>
  <rect x="685" y="124" width="135" height="24" rx="3" fill="#1f9d78"/>
  <text x="829" y="142" font-family="sans-serif" font-size="13" fill="#172033">0.018</text>
  <text x="570" y="190" font-family="sans-serif" font-size="13" fill="#172033">E2E-003</text>
  <rect x="685" y="172" width="180" height="24" rx="3" fill="#1f9d78"/>
  <text x="874" y="190" font-family="sans-serif" font-size="13" fill="#172033">0.024</text>
  <text x="570" y="238" font-family="sans-serif" font-size="13" fill="#172033">SAFE-001</text>
  <circle cx="689" cy="232" r="4" fill="#1f9d78"/>
  <text x="701" y="238" font-family="sans-serif" font-size="13" fill="#172033">0.000</text>

  <rect x="40" y="290" width="840" height="100" rx="8" fill="#f2f5f9"/>
  <text x="60" y="320" font-family="sans-serif" font-size="14" font-weight="700" fill="#172033">Interpretation</text>
  <text x="60" y="346" font-family="sans-serif" font-size="13" fill="#536173">All cases pass the configured 10,000 ms and USD 0.10 per-case fixture gates.</text>
  <text x="60" y="370" font-family="sans-serif" font-size="13" fill="#536173">Values are embedded in a deterministic evaluation fixture; measure Azure latency and billing separately.</text>
</svg>
