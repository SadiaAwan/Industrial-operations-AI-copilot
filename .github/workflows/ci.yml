name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality-and-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          version: "0.11.16"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app frontend tests evaluation scripts

      - name: Test
        run: uv run pytest -q

      - name: Enforce evaluation release gates
        run: >-
          uv run python -m scripts.run_evaluation
          --output evaluation/reports/ci-report.json

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase-11-evaluation-report
          path: evaluation/reports/ci-report.json
          if-no-files-found: error
          retention-days: 30
