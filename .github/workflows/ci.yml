name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bicep-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Lint and compile Bicep
        uses: azure/cli@v2
        with:
          inlineScript: |
            az bicep install
            az bicep lint --file infra/main.bicep
            az bicep build --file infra/main.bicep --stdout > /dev/null
            az bicep lint --file infra/subscription.bicep
            az bicep build --file infra/subscription.bicep --stdout > /dev/null
            for module in infra/modules/*.bicep; do
              az bicep lint --file "$module"
              az bicep build --file "$module" --stdout > /dev/null
            done
            for parameters in infra/environments/*.bicepparam; do
              az bicep build-params --file "$parameters" --stdout > /dev/null
            done

  quality-and-evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql+psycopg://copilot:copilot@localhost:5432/copilot_test
      TEST_DATABASE_URL: postgresql+psycopg://copilot:copilot@localhost:5432/copilot_test
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: copilot_test
          POSTGRES_USER: copilot
          POSTGRES_PASSWORD: copilot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U copilot -d copilot_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          version: "0.11.16"

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy app frontend tests evaluation scripts

      - name: Test
        run: uv run pytest -q

      - name: Enforce evaluation release gates
        run: >-
          uv run python -m scripts.run_evaluation
          --output evaluation/reports/ci-report.json

      - name: Upload evaluation report
        if: ${{ always() && hashFiles('evaluation/reports/ci-report.json') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: phase-11-evaluation-report
          path: evaluation/reports/ci-report.json
          if-no-files-found: error
          retention-days: 30
