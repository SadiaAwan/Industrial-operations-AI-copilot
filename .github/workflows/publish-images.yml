name: Build, verify, and publish container images

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-images-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

env:
  BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
  BUILD_VERSION: build-${{ github.event.workflow_run.id }}
  REGISTRY_NAME: ${{ vars.AZURE_CONTAINER_REGISTRY_NAME }}

jobs:
  build-verify-publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 45

    steps:
      - name: Check out verified commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.BUILD_SHA }}

      - name: Authenticate to Azure with OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve registry login server
        id: registry
        shell: bash
        run: |
          set -euo pipefail
          login_server="$(az acr show --name "$REGISTRY_NAME" --query loginServer --output tsv)"
          test -n "$login_server"
          echo "login_server=$login_server" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build API image from locked source
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          provenance: false
          tags: |
            ${{ steps.registry.outputs.login_server }}/industrial-copilot-api:${{ env.BUILD_SHA }}
            ${{ steps.registry.outputs.login_server }}/industrial-copilot-api:${{ env.BUILD_VERSION }}

      - name: Build UI image from locked source
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: frontend/Dockerfile
          load: true
          push: false
          provenance: false
          tags: |
            ${{ steps.registry.outputs.login_server }}/industrial-copilot-ui:${{ env.BUILD_SHA }}
            ${{ steps.registry.outputs.login_server }}/industrial-copilot-ui:${{ env.BUILD_VERSION }}

      - name: Scan API image for high-impact vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.registry.outputs.login_server }}/industrial-copilot-api:${{ env.BUILD_SHA }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: HIGH,CRITICAL

      - name: Scan UI image for high-impact vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.registry.outputs.login_server }}/industrial-copilot-ui:${{ env.BUILD_SHA }}
          format: table
          exit-code: "1"
          ignore-unfixed: false
          severity: HIGH,CRITICAL

      - name: Generate API SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.registry.outputs.login_server }}/industrial-copilot-api:${{ env.BUILD_SHA }}
          format: spdx-json
          output-file: sbom-api.spdx.json
          upload-artifact: false

      - name: Generate UI SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.registry.outputs.login_server }}/industrial-copilot-ui:${{ env.BUILD_SHA }}
          format: spdx-json
          output-file: sbom-ui.spdx.json
          upload-artifact: false

      - name: Upload SBOM evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-${{ env.BUILD_SHA }}
          path: sbom-*.spdx.json
          if-no-files-found: error
          retention-days: 90

      - name: Sign in to ACR without registry credentials
        shell: bash
        run: az acr login --name "$REGISTRY_NAME"

      - name: Publish verified images and release manifest
        id: publish
        shell: bash
        env:
          LOGIN_SERVER: ${{ steps.registry.outputs.login_server }}
        run: |
          set -euo pipefail
          api_repository="$LOGIN_SERVER/industrial-copilot-api"
          ui_repository="$LOGIN_SERVER/industrial-copilot-ui"
          docker push "$api_repository:$BUILD_SHA"
          docker push "$api_repository:$BUILD_VERSION"
          docker push "$ui_repository:$BUILD_SHA"
          docker push "$ui_repository:$BUILD_VERSION"
          api_digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$api_repository:$BUILD_SHA")"
          ui_digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$ui_repository:$BUILD_SHA")"
          jq -n \
            --arg commit "$BUILD_SHA" \
            --arg version "$BUILD_VERSION" \
            --arg apiImage "$api_digest" \
            --arg uiImage "$ui_digest" \
            '{commit: $commit, version: $version, apiImage: $apiImage, uiImage: $uiImage}' \
            > release-manifest.json

      - name: Upload immutable release manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-manifest-${{ env.BUILD_SHA }}
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 90
